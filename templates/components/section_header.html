<div class="section-head">
  <div>
    <h2 class="section-head__title">{{ title }}</h2>
    {% if subtitle %}<p class="section-head__sub">{{ subtitle }}</p>{% endif %}
  </div>
  {% if link_url %}
    <a href="{{ link_url }}" class="section-head__link">{{ link_text|default:"View all" }} <i class="bi bi-arrow-right"></i></a>
  {% endif %}
</div>
