{% extends "base.html" %}
{% block title %}{{ page_title }} – {{ SITE_NAME }}{% endblock %}
{% block content %}
<section class="section">
  <div class="container text-center py-5">
    <div class="coming-soon__icon"><i class="bi bi-hammer"></i></div>
    <h1 class="h2 mt-3">{{ page_title }} is on the way</h1>
    <p class="text-muted mx-auto" style="max-width: 32rem;">
      We're building this page. In the meantime, you can head back to the homepage.
    </p>
    <a href="{% url 'home' %}" class="btn btn-dsh-primary mt-2"><i class="bi bi-arrow-left"></i> Back to home</a>
  </div>
</section>
{% endblock %}
